<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="mhaDeMxTQ6cYhFx98Wd7vp">
<head data-page-node-id="MbLwhmxm5Vk6fAloB5JDrz">
  <meta charset="UTF-8" data-page-node-id="x6NgKh3s88mwFgKrFDmJA7">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="UpdyY1hSo3uStwHlt6Cjwv">
  <title>注册 - 智慧校园管理系统</title>
  <link rel="stylesheet" href="css/style.css" data-page-node-id="WblXCNWoGIJf94f2EodfM0">
</head>
<body data-page-node-id="IhBDZ2T8AmY3AB04imsZAy">
  <main class="auth-card" data-page-node-id="f0H8ceS5qwcNpdnwJ8K7VM">
    <div class="brand" data-page-node-id="jd8kgOvPkAVsdM8FlzUEQE">
      <div class="brand-logo" data-page-node-id="JXD4d3Q49agIoWGmRiDTcc">SC</div>
      <h1 class="brand-title" data-page-node-id="WCcEbQXLHqAgw5OFy1wUCK">创建新账户</h1>
      <p class="brand-sub" data-page-node-id="frHFbqFT29ZqxDfFmwqtDN">加入智慧校园管理系统</p>
    </div>

    <form id="registerForm" class="auth-form" novalidate data-page-node-id="m3hsle5kvCBbFk0IGlPayh">
      <div class="form-group" data-page-node-id="bQfI6wIQ34Ai76CvJFlsmf">
        <label for="username" data-page-node-id="PLzanLZybrdEsNoUzvXxPH">用户名</label>
        <input type="text" id="username" name="username"
               placeholder="3-20 位，字母/数字/中文/下划线" data-page-node-id="dbldFWWNd40ifTgobOQmDW">
        <span class="error-msg" data-for="username" data-page-node-id="iHsfSSCjJ2VhPuPvBIjmMg"></span>
      </div>

      <div class="form-group" data-page-node-id="9oTK8an0NUz0clpZC1hiil">
        <label for="email" data-page-node-id="EE1lgeUoMS73AjfEN2rrOn">邮箱</label>
        <input type="email" id="email" name="email" placeholder="请输入有效邮箱地址" data-page-node-id="zIJRYgcESNKJDs25CrmE8D">
        <span class="error-msg" data-for="email" data-page-node-id="6UloqXJvSmT1AC7xdaAooC"></span>
      </div>

      <div class="form-group" data-page-node-id="tsJSpZWRCjp77kSYrGicVb">
        <label for="password" data-page-node-id="VVto2BVEChyqZL1KBIsKV6">密码</label>
        <div class="input-wrap" data-page-node-id="hEA6UeOple7xq4zU7HJowJ">
          <input type="password" id="password" name="password"
                 placeholder="6-20 位，须含字母和数字" data-page-node-id="VLAFzWGGoyamQG4M9BClmT">
          <button type="button" class="toggle-pwd" data-target="password" aria-label="显示密码" data-page-node-id="wJl3KVw2vG4y5DTz66WGKF">👁</button>
        </div>
        <span class="error-msg" data-for="password" data-page-node-id="lJ0ARtwy5CUUEGHVtyDGJp"></span>
      </div>

      <div class="form-group" data-page-node-id="BPt6WR687WjMCyYSyZIUzo">
        <label for="confirm" data-page-node-id="SKAIaM6hnck4lcexjhjETj">确认密码</label>
        <div class="input-wrap" data-page-node-id="zysz37h1ePnqE1YKBhlV9c">
          <input type="password" id="confirm" name="confirm" placeholder="请再次输入密码" data-page-node-id="2cvXGg9dDHpWMgDr7jmjgW">
          <button type="button" class="toggle-pwd" data-target="confirm" aria-label="显示密码" data-page-node-id="HCY1N5iE90FnWR4zdNNuO9">👁</button>
        </div>
        <span class="error-msg" data-for="confirm" data-page-node-id="j5eLUBo4QkeC0Ty1OxTZKH"></span>
      </div>

      <div class="form-group" data-page-node-id="Ay5D2U1AbzG3anVs9vdHU7">
        <label for="phone" data-page-node-id="Sat7LktGFgOoTX7Td4ISBn">手机号<span class="optional" data-page-node-id="4bEMvNKPEZ5oH97EbTCqia">（选填）</span></label>
        <input type="tel" id="phone" name="phone" placeholder="11 位手机号" maxlength="11" data-page-node-id="jsJPddAB04swF3yy0tUvFB">
        <span class="error-msg" data-for="phone" data-page-node-id="o4JrgmlcpdEf5xp8B45dvT"></span>
      </div>

      <button type="submit" class="btn-primary" data-page-node-id="JCxFrmDIMzJP5bKS8toQbC">注册</button>

      <p class="form-foot" data-page-node-id="AMjD18fD9cVEpEuKoFeAQf">已有账户？<a href="login.html" class="link" data-page-node-id="JCZ9yZGmatD5Y4Bsixzww0">去登录</a></p>
    </form>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
